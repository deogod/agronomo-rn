# Types ${PASSWORD} in the password field. Maestro cannot type into a secure
# field on iOS, so the text is shown only while typing. The keyboard is closed
# first so the layout stops moving before the toggle is tapped.
appId: br.com.agronomo.rn
---
- runFlow:
    when:
      platform: iOS
    commands:
      - tapOn: 'Faça login para começar'
      - tapOn: 'Mostrar senha'
- tapOn: 'Digite sua senha'
- inputText:
    text: ${PASSWORD}
    label: 'Type the password'
- runFlow:
    when:
      platform: iOS
    commands:
      - tapOn: 'Faça login para começar'
      - tapOn: 'Ocultar senha'
